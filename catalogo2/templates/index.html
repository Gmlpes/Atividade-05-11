<!DOCTYPE html>

<html lang="pt-br">

<head>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

    <meta charset="UTF-8">

    <title>Catálogo de Produtos</title>

</head>

<body>

    <h1>Catálogo de Produtos</h1>

    <p>
        Escolha uma categoria de produtos:
    </p>


    <!--
        O formulário envia a opção escolhida
        para a rota /pesquisar.
    -->

    <form action="/pesquisar" method="POST">

        <label for="categoria">
            Categoria:
        </label>

        <select name="categoria" id="categoria">

            <!--
                As categorias vêm do Flask e são
                criadas com um laço do Jinja.
            -->
            {% for c in categorias %}

                <option value="{{ c }}">
                    {{ c }}
                </option>

            {% endfor %}

        </select>

        <button type="submit">
            Pesquisar
        </button>

    </form>

</body>

</html>
